name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ls $ANDROID_SDK_ROOT/platforms || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -e
          find . -name "*.apk" -type f -exec ls -lh {} \;
          APK=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then echo "NO APK PRODUCED"; exit 1; fi
          echo "APK=$APK" >> $GITHUB_ENV
          cp "$APK" whale-pet.apk
          ls -l whale-pet.apk

      - name: Compute checksum
        run: sha256sum whale-pet.apk | tee sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: whale-pet-apk
          path: |
            whale-pet.apk
            sha256.txt
          retention-days: 30
