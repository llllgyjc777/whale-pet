plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.moe.whale'
    compileSdk 34

    defaultConfig {
        applicationId "com.moe.whale"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    // 不依赖外部仓库的签名，Actions 里用 debug 签名即可
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
